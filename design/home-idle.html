<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Contexts Popup - Home (Idle)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            amber: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            },
            slate: {
              850: '#151e2e',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #fdfbf7 0%, #f3ece2 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .popup-frame {
      width: 360px;
      height: 540px;
      border-radius: 20px;
      box-shadow: 0 20px 45px -10px rgba(180, 83, 9, 0.12), 0 0 0 1px rgba(180, 83, 9, 0.1), 0 8px 16px -4px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #FFFFFF;
      position: relative;
    }
    .tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- Chrome Extension Modal Standalone -->
  <div class="popup-frame">
    <!-- Top Active Context Header Bar -->
    <div class="px-4 pt-3.5 pb-2.5 border-b border-[#f3ece2] flex items-center justify-between bg-[#fbf9f6]">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-white shadow-sm shadow-amber-700/20">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-[10px] font-bold tracking-wider uppercase text-amber-800/70 leading-none">Focus Context</span>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-amber-600 animate-pulse"></span>
            <span class="text-xs font-bold text-slate-800 leading-none">Development</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button class="px-2 py-1 rounded-md text-[11px] font-semibold text-amber-900 bg-amber-100/70 hover:bg-amber-100 flex items-center gap-1 transition-colors">
          <span>Switch</span>
          <svg class="w-3 h-3 text-amber-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <button class="w-6 h-6 rounded-md hover:bg-amber-100/50 flex items-center justify-center text-slate-400 hover:text-slate-700 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <circle cx="12" cy="12" r="1"/>
            <circle cx="12" cy="5" r="1"/>
            <circle cx="12" cy="19" r="1"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Active Shield Notification Strip -->
    <div class="px-4 py-1.5 bg-amber-50/70 border-b border-amber-100/60 flex items-center justify-between">
      <div class="flex items-center gap-1.5 text-[11px] text-amber-900 font-medium">
        <svg class="w-3.5 h-3.5 text-amber-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v4a1 1 0 102 0V7z" clip-rule="evenodd"/>
        </svg>
        <span class="truncate">Gorgon Shield active on <strong class="font-semibold text-slate-800">github.com</strong></span>
      </div>
      <span class="text-[9px] font-bold text-amber-700 uppercase tracking-wider bg-white/80 px-1.5 py-0.5 rounded border border-amber-200">Guarded</span>
    </div>

    <!-- Main Extension Body Content -->
    <div class="flex-1 px-5 pt-3 pb-3 flex flex-col justify-between overflow-y-auto">
      <!-- Circular Arc & Central Timer Countdown -->
      <div class="flex flex-col items-center justify-center my-auto">
        <div class="relative w-44 h-44 flex items-center justify-center">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 160 160">
            <!-- Background track ring -->
            <circle cx="80" cy="80" r="66" stroke="#f3ede3" stroke-width="7" fill="none" stroke-linecap="round"/>
            <!-- Active Golden Aegis ring -->
            <circle cx="80" cy="80" r="66" stroke="url(#aegisGradient)" stroke-width="7" fill="none" stroke-dasharray="414" stroke-dashoffset="103" stroke-linecap="round"/>
            <defs>
              <linearGradient id="aegisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#b45309" />
                <stop offset="60%" stop-color="#d97706" />
                <stop offset="100%" stop-color="#f59e0b" />
              </linearGradient>
            </defs>
          </svg>

          <!-- Inside Timer Content -->
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span class="text-4xl font-extrabold text-slate-900 tracking-tight tabular font-mono">25:00</span>
            <div class="flex items-center gap-1 mt-1 text-[11px] font-semibold text-amber-800">
              <svg class="w-3 h-3 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              <span>Ready for deep work</span>
            </div>
            <span class="text-[10px] text-slate-400 mt-0.5">Session 4 of 6 today</span>
          </div>
        </div>

        <!-- Duration Select Chips -->
        <div class="flex items-center gap-1.5 mt-3">
          <button class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-amber-700 text-white shadow-sm shadow-amber-800/30">25 min</button>
          <button class="px-3 py-1.5 rounded-full text-xs font-medium bg-[#f5efe6] text-slate-700 hover:bg-[#eae1d4] transition-colors">50 min</button>
          <button class="px-3 py-1.5 rounded-full text-xs font-medium bg-[#f5efe6] text-slate-700 hover:bg-[#eae1d4] transition-colors">Custom 15m</button>
        </div>
      </div>

      <!-- Action & Current Tab Detector -->
      <div class="space-y-2.5 pt-2">
        <button class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-amber-700 via-amber-600 to-amber-700 hover:from-amber-800 hover:to-amber-700 text-white font-bold text-sm shadow-md shadow-amber-700/25 flex items-center justify-center gap-2 transition-all transform active:scale-[0.99]">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <span>Start Focus Session</span>
        </button>

        <!-- Current Tab Action Pill -->
        <div class="p-2 rounded-xl bg-[#faf7f2] border border-[#eee5d8] flex items-center justify-between text-xs">
          <div class="flex items-center gap-2 truncate pr-2">
            <div class="w-5 h-5 rounded-full bg-slate-200 flex items-center justify-center text-[10px] font-bold text-slate-600 flex-shrink-0">
              R
            </div>
            <span class="truncate text-slate-600 font-mono text-[11px]">reddit.com/...</span>
          </div>
          <button class="px-2 py-1 rounded-md text-[11px] font-bold text-amber-800 bg-amber-100 hover:bg-amber-200 flex-shrink-0 flex items-center gap-1 transition-colors">
            <svg class="w-3 h-3 text-amber-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
            </svg>
            <span>Block in Dev</span>
          </button>
        </div>

        <!-- Quick Summary Ribbon -->
        <div class="pt-1 flex items-center justify-between text-[11px] text-slate-500 border-t border-[#f0e8dc]">
          <span class="flex items-center gap-1 font-medium">
            <svg class="w-3.5 h-3.5 text-amber-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <circle cx="12" cy="12" r="10" stroke-width="2"/>
              <path stroke-width="2" stroke-linecap="round" d="M12 6v6l4 2"/>
            </svg>
            Today: <strong class="text-slate-800 font-semibold">2h 35m</strong>
          </span>
          <span class="text-slate-600 font-medium">
            <strong class="text-amber-800 font-bold">4</strong> of 6 sessions done
          </span>
        </div>
      </div>
    </div>

    <!-- Chrome Extension Persistent Bottom Navigation Tabs -->
    <div class="h-13 bg-[#fbf9f6] border-t border-[#f1e8dd] px-4 py-2 flex items-center justify-around">
      <button class="flex flex-col items-center gap-0.5 text-amber-800">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-[10px] font-bold">Home</span>
        <div class="w-1 h-1 rounded-full bg-amber-700 mt-0.5"></div>
      </button>

      <button class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span class="text-[10px] font-medium">Contexts</span>
        <div class="w-1 h-1 rounded-full bg-transparent mt-0.5"></div>
      </button>

      <button class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-[10px] font-medium">Stats</span>
        <div class="w-1 h-1 rounded-full bg-transparent mt-0.5"></div>
      </button>
    </div>
  </div>

</body>
</html>
