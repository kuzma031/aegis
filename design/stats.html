<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Contexts Popup - Stats Tab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            amber: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #fdfbf7 0%, #f3ece2 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .popup-frame {
      width: 360px;
      height: 540px;
      border-radius: 20px;
      box-shadow: 0 20px 45px -10px rgba(180, 83, 9, 0.12), 0 0 0 1px rgba(180, 83, 9, 0.1), 0 8px 16px -4px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #FFFFFF;
      position: relative;
    }
    .tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- Chrome Extension Modal Standalone -->
  <div class="popup-frame">
    <!-- Header with period filter -->
    <div class="px-4 pt-3.5 pb-2.5 border-b border-[#f3ece2] flex items-center justify-between bg-[#fbf9f6]">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-amber-100 flex items-center justify-center text-amber-800">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
        </div>
        <h2 class="text-xs font-bold text-slate-900">Mindful Rhythm Stats</h2>
      </div>

      <!-- Filter chips -->
      <div class="flex items-center bg-[#f0e8dc] p-0.5 rounded-lg text-[10px] font-bold">
        <button class="px-2 py-0.5 rounded-md bg-white text-slate-800 shadow-xs">Today</button>
        <button class="px-2 py-0.5 rounded-md text-slate-500 hover:text-slate-800">7 Days</button>
      </div>
    </div>

    <!-- Main Extension Body Content -->
    <div class="flex-1 p-3.5 space-y-3 overflow-y-auto">
      
      <!-- Top Metrics Overview Grid -->
      <div class="grid grid-cols-2 gap-2">
        <div class="p-3 rounded-xl bg-gradient-to-br from-amber-50 to-[#fdf8f0] border border-amber-200/70">
          <span class="text-[10px] font-bold text-amber-800/80 uppercase tracking-wide">Deep Flow Time</span>
          <div class="text-xl font-extrabold text-slate-900 mt-0.5 tabular font-mono">3h 25m</div>
          <div class="flex items-center gap-1 text-[10px] text-emerald-700 font-semibold mt-1">
            <span>↑ 40m vs yesterday</span>
          </div>
        </div>

        <div class="p-3 rounded-xl bg-[#fbf9f6] border border-[#eee5d8]">
          <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wide">Sessions Shielded</span>
          <div class="text-xl font-extrabold text-slate-900 mt-0.5 tabular font-mono">5 <span class="text-xs font-normal text-slate-500">done</span></div>
          <div class="flex items-center gap-1 text-[10px] text-amber-800 font-semibold mt-1">
            <span>100% completion</span>
          </div>
        </div>
      </div>

      <!-- Mini Weekly Cadence Bar Chart -->
      <div class="p-3 rounded-xl bg-[#faf7f2] border border-[#eee4d6]">
        <div class="flex items-center justify-between text-[11px] mb-2">
          <span class="font-bold text-slate-800">Weekly Focus Cadence</span>
          <span class="text-[10px] text-slate-500">Target: 4h / day</span>
        </div>

        <!-- 7-day Bar Visuals -->
        <div class="flex items-end justify-between gap-1.5 h-18 pt-2 px-1">
          <!-- Mon -->
          <div class="flex-1 flex flex-col items-center gap-1">
            <div class="w-full bg-amber-200 rounded-t-sm" style="height: 38px;"></div>
            <span class="text-[9px] text-slate-500 font-medium">M</span>
          </div>
          <!-- Tue -->
          <div class="flex-1 flex flex-col items-center gap-1">
            <div class="w-full bg-amber-300 rounded-t-sm" style="height: 48px;"></div>
            <span class="text-[9px] text-slate-500 font-medium">T</span>
          </div>
          <!-- Wed -->
          <div class="flex-1 flex flex-col items-center gap-1">
            <div class="w-full bg-amber-400 rounded-t-sm" style="height: 52px;"></div>
            <span class="text-[9px] text-slate-500 font-medium">W</span>
          </div>
          <!-- Thu -->
          <div class="flex-1 flex flex-col items-center gap-1">
            <div class="w-full bg-amber-500 rounded-t-sm" style="height: 44px;"></div>
            <span class="text-[9px] text-slate-500 font-medium">T</span>
          </div>
          <!-- Fri (Today) -->
          <div class="flex-1 flex flex-col items-center gap-1">
            <div class="w-full bg-amber-700 rounded-t-sm shadow-xs" style="height: 58px;"></div>
            <span class="text-[9px] font-bold text-amber-900">F</span>
          </div>
          <!-- Sat -->
          <div class="flex-1 flex flex-col items-center gap-1">
            <div class="w-full bg-slate-200/80 rounded-t-sm" style="height: 12px;"></div>
            <span class="text-[9px] text-slate-400 font-medium">S</span>
          </div>
          <!-- Sun -->
          <div class="flex-1 flex flex-col items-center gap-1">
            <div class="w-full bg-slate-200/80 rounded-t-sm" style="height: 8px;"></div>
            <span class="text-[9px] text-slate-400 font-medium">S</span>
          </div>
        </div>
      </div>

      <!-- Distractions Shielded Breakdown -->
      <div class="p-3 rounded-xl bg-[#faf7f2] border border-[#eee4d6]">
        <div class="flex items-center justify-between text-[11px] mb-2">
          <span class="font-bold text-slate-800">Distractions Warded Off</span>
          <span class="text-[10px] font-semibold text-amber-800">38 blocked visits</span>
        </div>

        <div class="space-y-1.5 text-xs">
          <div class="flex items-center justify-between">
            <span class="text-slate-600 text-[11px]">reddit.com</span>
            <span class="font-bold text-slate-800 text-[11px]">19 deflected</span>
          </div>
          <div class="w-full bg-[#eee4d6] h-1.5 rounded-full overflow-hidden">
            <div class="bg-amber-600 h-full rounded-full" style="width: 50%;"></div>
          </div>

          <div class="flex items-center justify-between pt-1">
            <span class="text-slate-600 text-[11px]">youtube.com</span>
            <span class="font-bold text-slate-800 text-[11px]">12 deflected</span>
          </div>
          <div class="w-full bg-[#eee4d6] h-1.5 rounded-full overflow-hidden">
            <div class="bg-amber-700 h-full rounded-full" style="width: 32%;"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Chrome Extension Persistent Bottom Navigation Tabs -->
    <div class="h-13 bg-[#fbf9f6] border-t border-[#f1e8dd] px-4 py-2 flex items-center justify-around">
      <button class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-[10px] font-medium">Home</span>
        <div class="w-1 h-1 rounded-full bg-transparent mt-0.5"></div>
      </button>

      <button class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span class="text-[10px] font-medium">Contexts</span>
        <div class="w-1 h-1 rounded-full bg-transparent mt-0.5"></div>
      </button>

      <button class="flex flex-col items-center gap-0.5 text-amber-800">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-[10px] font-bold">Stats</span>
        <div class="w-1 h-1 rounded-full bg-amber-700 mt-0.5"></div>
      </button>
    </div>
  </div>

</body>
</html>
