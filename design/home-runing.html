<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Contexts Popup - Session Running</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            amber: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            },
            slate: {
              850: '#151e2e',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #fdfbf7 0%, #f3ece2 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .popup-frame {
      width: 360px;
      height: 540px;
      border-radius: 20px;
      box-shadow: 0 20px 45px -10px rgba(180, 83, 9, 0.12), 0 0 0 1px rgba(180, 83, 9, 0.1), 0 8px 16px -4px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #FFFFFF;
      position: relative;
    }
    .tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

  <!-- Chrome Extension Modal Standalone -->
  <div class="popup-frame">
    <!-- Top Active Context Header Bar -->
    <div class="px-4 pt-3.5 pb-2.5 border-b border-[#f3ece2] flex items-center justify-between bg-[#fbf9f6]">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-lg bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-white shadow-sm shadow-amber-700/20">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-bold text-slate-900 leading-none">Development</span>
            <span class="px-1.5 py-0.2 bg-amber-100 text-amber-800 text-[10px] font-bold rounded">Active</span>
          </div>
          <span class="text-[10px] text-slate-500 leading-none mt-1">Distractions blocked (14 sites)</span>
        </div>
      </div>

      <button class="w-6 h-6 rounded-md hover:bg-amber-100/50 flex items-center justify-center text-slate-400 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <circle cx="12" cy="12" r="1"/>
          <circle cx="12" cy="5" r="1"/>
          <circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>

    <!-- Live Shield State Banner -->
    <div class="px-4 py-1.5 bg-amber-50/70 border-b border-amber-100/60 flex items-center justify-between">
      <div class="flex items-center gap-1.5 text-[11px] text-amber-900 font-medium">
        <span class="w-2 h-2 rounded-full bg-amber-600 animate-ping flex-shrink-0"></span>
        <span class="truncate">Gorgon Aegis Perimeter Locked</span>
      </div>
      <span class="text-[10px] font-bold text-amber-800 tabular">Flow #2</span>
    </div>

    <!-- Main Extension Body Content -->
    <div class="flex-1 px-5 pt-3 pb-3 flex flex-col justify-between overflow-y-auto">
      <!-- Circular Arc & Live Counting Timer -->
      <div class="flex flex-col items-center justify-center my-auto">
        <div class="relative w-44 h-44 flex items-center justify-center">
          <svg class="w-full h-full transform -rotate-90" viewBox="0 0 160 160">
            <!-- Background track ring -->
            <circle cx="80" cy="80" r="66" stroke="#f3ede3" stroke-width="7" fill="none" stroke-linecap="round"/>
            <!-- Active Progress Arc (60% remaining) -->
            <circle cx="80" cy="80" r="66" stroke="url(#runningArcGradient)" stroke-width="7" fill="none" stroke-dasharray="414" stroke-dashoffset="165" stroke-linecap="round"/>
            <defs>
              <linearGradient id="runningArcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#b45309" />
                <stop offset="70%" stop-color="#d97706" />
                <stop offset="100%" stop-color="#f59e0b" />
              </linearGradient>
            </defs>
          </svg>

          <!-- Inside Timer Content -->
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span class="text-4xl font-extrabold text-slate-900 tracking-tight tabular font-mono">15:08</span>
            <span class="text-[11px] font-semibold text-slate-500 mt-1">remaining of 25 min</span>
            <div class="flex items-center gap-1 mt-1 text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
              <span>Deep Block</span>
            </div>
          </div>
        </div>

        <!-- Serene Encouragement Card -->
        <div class="mt-3 px-3 py-1.5 rounded-full bg-[#fbf9f6] border border-[#eee5d8] text-[11px] text-slate-600 font-medium flex items-center gap-1.5 shadow-sm">
          <span class="text-amber-600 text-xs">✦</span>
          <span>You're in the zone. Keep up the steady flow.</span>
        </div>
      </div>

      <!-- Controls: Pause & End Session Quietly -->
      <div class="space-y-2.5 pt-2">
        <div class="grid grid-cols-2 gap-2">
          <button class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs shadow-sm flex items-center justify-center gap-1.5 transition-colors">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
            <span>Pause</span>
          </button>

          <button class="py-2.5 px-3 rounded-xl bg-[#faf7f2] hover:bg-[#f3ece2] text-slate-700 font-semibold text-xs border border-[#e5dcce] transition-colors">
            End Session
          </button>
        </div>

        <!-- Dynamic Context Shielding Tab Action -->
        <div class="p-2 rounded-xl bg-[#faf7f2] border border-[#eee5d8] flex items-center justify-between text-xs">
          <div class="flex items-center gap-2 truncate pr-2">
            <div class="w-5 h-5 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-[10px] font-bold flex-shrink-0">
              Y
            </div>
            <span class="truncate text-slate-600 font-mono text-[11px]">youtube.com/...</span>
          </div>
          <button class="px-2 py-1 rounded-md text-[11px] font-bold text-amber-800 bg-amber-100 hover:bg-amber-200 flex-shrink-0 flex items-center gap-1 transition-colors">
            <svg class="w-3 h-3 text-amber-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
            </svg>
            <span>Add to Blocked</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Chrome Extension Persistent Bottom Navigation Tabs -->
    <div class="h-13 bg-[#fbf9f6] border-t border-[#f1e8dd] px-4 py-2 flex items-center justify-around">
      <button class="flex flex-col items-center gap-0.5 text-amber-800">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-[10px] font-bold">Home</span>
        <div class="w-1 h-1 rounded-full bg-amber-700 mt-0.5"></div>
      </button>

      <button class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span class="text-[10px] font-medium">Contexts</span>
        <div class="w-1 h-1 rounded-full bg-transparent mt-0.5"></div>
      </button>

      <button class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-[10px] font-medium">Stats</span>
        <div class="w-1 h-1 rounded-full bg-transparent mt-0.5"></div>
      </button>
    </div>
  </div>

</body>
</html>
